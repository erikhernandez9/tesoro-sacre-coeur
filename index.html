<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Tesoro del Sacré Coeur</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 10px 14px;
           background: rgba(0,0,0,.6); color: #fff; display: flex; justify-content: space-between; font-size: 15px; }
    #msg { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 14px; min-height: 60px;
           background: rgba(20,20,60,.85); color: #ffe27a; font-size: 17px; text-align: center; }
    #intro { position: fixed; inset: 0; z-index: 20; background: #14143c; color: #fff; display: flex;
             flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    #intro button { margin-top: 20px; padding: 12px 28px; font-size: 18px; border: 0; border-radius: 8px; background: #ffe27a; }
    #win { display: none; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.85); color: gold;
           flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 22px; padding: 24px; }
  </style>
</head>
<body>
  <div id="intro">
    <h1>🛡️ Las 3 piezas del escudo</h1>
    <p>El escudo original de la UCU se rompió en 3 piezas y alguien las escondió en el Sacré Coeur.<br>
       Recolectá las 3 piezas para reconstruirlo y desbloquear el tesoro.</p>
    <p>Permití el acceso a la cámara y apuntá a los marcadores.</p>
    <p id="first-clue"></p>
    <button id="start">Comenzar</button>
  </div>
  <div id="hud"><span id="progress">Piezas: ⬜ ⬜ ⬜</span><span id="timer">00:00</span></div>
  <div id="msg"></div>
  <div id="win">🛡️<br>¡Reconstruiste el escudo!<br><small id="final"></small></div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; colorManagement: true"
           arjs="trackingMethod: best; sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-marker type="barcode" value="1" id="m1" data-idx="0">
      <a-text value="Pieza 1/3" align="center" color="#ffe27a" position="0 0.1 -1.1" rotation="-90 0 0" scale="2 2 2"></a-text>
      <a-cylinder class="piece" position="0 0.3 0" radius="0.5" height="0.12" theta-start="0" theta-length="120" color="#1e4fa3"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-cylinder>
    </a-marker>

    <a-marker type="barcode" value="2" id="m2" data-idx="1">
      <a-text value="Pieza 2/3" align="center" color="#ffe27a" position="0 0.1 -1.1" rotation="-90 0 0" scale="2 2 2"></a-text>
      <a-cylinder class="piece" position="0 0.3 0" radius="0.5" height="0.12" theta-start="120" theta-length="120" color="#f2c230"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-cylinder>
    </a-marker>

    <a-marker type="barcode" value="3" id="m3" data-idx="2">
      <a-text value="Pieza 3/3" align="center" color="#ffe27a" position="0 0.1 -1.1" rotation="-90 0 0" scale="2 2 2"></a-text>
      <a-cylinder class="piece" position="0 0.3 0" radius="0.5" height="0.12" theta-start="240" theta-length="120" color="#4a90e2"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-cylinder>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const FIRST_CLUE = 'Primera pista: la primera pieza está en la pintura al frente de la Capilla del Encuentro.';
    const CLUES = [
      '¡Pieza 1! La segunda pieza está donde el papel y el cartón tienen segunda vida.',
      '¡Pieza 2! La última pieza la custodia una máquina hambrienta frente a los baños del piso 1.',
      '¡Pieza 3! El escudo se está reconstruyendo...'
    ];
    const SHIELD_HTML = `
      <a-entity position="0 0.3 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
        <a-cylinder radius="0.5" height="0.12" theta-start="0" theta-length="120" color="#1e4fa3"></a-cylinder>
        <a-cylinder radius="0.5" height="0.12" theta-start="120" theta-length="120" color="#f2c230"></a-cylinder>
        <a-cylinder radius="0.5" height="0.12" theta-start="240" theta-length="120" color="#4a90e2"></a-cylinder>
        <a-box position="0 0.08 0" width="0.12" height="0.04" depth="0.6" color="#ffffff"></a-box>
        <a-box position="0 0.08 -0.08" width="0.4" height="0.04" depth="0.12" color="#ffffff"></a-box>
      </a-entity>`;
    const TOTAL = CLUES.length;
    const found = new Set();
    let startTime = null, timerId = null, done = false;
    const $ = id => document.getElementById(id);

    function beep(freq = 660, dur = 0.2) {
      try {
        const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.2, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.start(); o.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function renderInventory() {
      const slots = CLUES.map((_, i) => (found.has(i) ? '✅' : '⬜')).join(' ');
      $('progress').textContent = `Piezas: ${slots}`;
    }

    function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

    $('first-clue').textContent = FIRST_CLUE;

    $('start').addEventListener('click', () => {
      $('intro').style.display = 'none';
      $('msg').textContent = FIRST_CLUE;
      startTime = Date.now();
      beep(440);
      timerId = setInterval(() => { if (!done) $('timer').textContent = fmt(Math.floor((Date.now() - startTime) / 1000)); }, 500);
    });

    document.querySelectorAll('a-marker[data-idx]').forEach(el => {
      const idx = Number(el.dataset.idx);
      el.addEventListener('markerFound', () => {
        if (!startTime || done) return;
        if (!found.has(idx)) {
          found.add(idx);
          renderInventory();
          beep(500 + 150 * found.size);
          if (navigator.vibrate) navigator.vibrate(150);
        }
        if (found.size === TOTAL) {
          // Al completar todos, el escudo armado reemplaza a la pieza del marcador actual.
          // Se crea uno nuevo: mover entidades A-Frame entre padres no se renderiza bien.
          el.querySelector('.piece').setAttribute('visible', false);
          el.insertAdjacentHTML('beforeend', SHIELD_HTML);
          $('msg').textContent = '¡Las 3 piezas encajaron! El escudo de la UCU está completo.';
          done = true;
          clearInterval(timerId);
          [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, 0.3), i * 250));
          setTimeout(() => {
            $('final').textContent = `Tiempo: ${$('timer').textContent}`;
            $('win').style.display = 'flex';
          }, 6000);
        } else {
          $('msg').textContent = CLUES[idx];
        }
      });
    });

    $('win').addEventListener('click', () => { $('win').style.display = 'none'; });
  </script>
</body>
</html>
